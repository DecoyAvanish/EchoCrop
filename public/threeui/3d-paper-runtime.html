<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Paper — Undersign Lease</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent}</style>
<script>
  // The canonical registered scene stays local. One request replaces 39 chunks;
  // readiness comes from the first rendered frame, rather than iframe load.
  fetch('/threeui/3d-paper-site-of-the-year.html').then(response=>{
    if(!response.ok)throw new Error('The paper could not be loaded.');
    return response.text();
  }).then(source=>{
    source=source
      .replace(/<link[^>]+(?:fonts\.googleapis\.com|fonts\.gstatic\.com)[^>]*>/g,'')
      .replace('<style>','<style>@font-face{font-family:"JetBrains Mono";src:url("/threeui/fragment-mono.woff2") format("woff2");font-display:swap}.paper-light #vig,.paper-light #dof{display:none}.paper-light #hint{color:#38445a;text-shadow:none}.paper-light #hint b{color:#14213a}')
      .replace(':root{ --bg:#08080a;',':root{ --bg:transparent;')
      .replace('html,body{height:100%;background:var(--bg);','html,body{height:100%;background:transparent;')
      .replace('background:rgba(8,8,10,.05)}','background:rgba(8,8,10,.025)}')
      .replace('CONFIDENCE 98%','LOCAL ANALYSIS')
      .replaceAll('X—RAY','X-RAY')
      .replace('<div id="hint">','<div id="hint" hidden>')
      .replace('font-size:10px;letter-spacing:.22em;text-transform:uppercase;','font-size:14px;letter-spacing:.08em;text-transform:uppercase;')
      .replace('color:rgba(242,242,240,.30);opacity:0','color:#c4d1df;text-shadow:0 2px 6px #05070d;opacity:0')
      .replace('const T = THREE;',`const T = THREE;
window.addEventListener('error',event=>{if(event.error)window.parent.postMessage({type:'threeui-paper-error'},location.origin)});`)
      .replace('Math.min(window.devicePixelRatio||1, 2)','Math.min(window.devicePixelRatio||1,matchMedia(\'(max-width:700px)\').matches?1:1.5)')
      .replace('let intro = 0;',`let intro = 1,sceneVisible=true,frameId=0,lastPaint=0;
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.origin!==location.origin||event.data?.type!=='threeui-paper-visibility')return;
  sceneVisible=!!event.data.visible;
  if(!sceneVisible&&frameId){cancelAnimationFrame(frameId);frameId=0}
  else if(sceneVisible&&!frameId)frame();
});
canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();window.parent.postMessage({type:'threeui-paper-error'},location.origin)});`)
      .replace('function frame(){',`function frame(){
  const frameNow=performance.now();
  if(!REDUCED&&sceneVisible&&!document.hidden&&frameNow-lastPaint<1000/30){frameId=requestAnimationFrame(frame);return}
  lastPaint=frameNow;`)
      .replace('if(!REDUCED) requestAnimationFrame(frame);','frameId=0;if(!REDUCED&&sceneVisible&&!document.hidden)frameId=requestAnimationFrame(frame);')
      .replace('  frame();\n}',"  frame();\n  window.parent.postMessage({type:'threeui-paper-ready'},location.origin);\n}");
    document.open();document.write(source);document.close();
    // Follow the page theme (same origin), so light mode gets a clean stage.
    (()=>{try{const app=parent.document.querySelector('.app');if(!app)return;const sync=()=>document.documentElement.classList.toggle('paper-light',app.classList.contains('light'));sync();new MutationObserver(sync).observe(app,{attributes:true,attributeFilter:['class']})}catch{}})();
  }).catch(()=>{
    window.parent.postMessage({type:'threeui-paper-error'},location.origin);
  });
</script>

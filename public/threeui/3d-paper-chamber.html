<style>

/* ---------- layers over it ---------- */

<!-- Keep the runtime in this frame's realm: its CanvasTexture belongs here.
     The asset is still shared through HTTP caching, not cross-window constructors. -->
<script src="/threeui/vendor/three-r149.js"></script>
<script>
(function(){
"use strict";
const T = THREE;
const TW = 1200, TH = 1656;               // authoring grid (0.7246)
const CW = 1400, CH = 1932;               // canvas pixels, for crisper type
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rng = (s)=>()=>{ s=(s*1103515245+12345)&0x7fffffff; return (s>>>8)/8388608; };
const REDUCED = new URLSearchParams(window.location.search).has('reduced') ||
  (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
window.addEventListener('error',event=>{if(event.error)window.parent.postMessage({type:'threeui-paper-error'},location.origin)});

/* ======================================================================
   1. THE CERTIFICATE — printed on glass
   ====================================================================== */
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function mid(ctx,txt,y,x){ const cx = x===undefined ? 600 : x;
  ctx.fillText(txt, cx-ctx.measureText(txt).width/2, y); }

function track(ctx,txt,x,y,sp,centre){
  const chars=[...txt];
  let total=0; for(const c of chars) total+=ctx.measureText(c).width+sp;
  total-=sp;
  let cx = centre ? x-total/2 : x;
  for(const c of chars){ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+sp; }
  return total;
}

function wrapMid(ctx,text,y,maxW,lh,x){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ mid(ctx,line,yy,x); line=w; yy+=lh; }
    else line=t; }
  if(line) mid(ctx,line,yy,x);
  return yy;
}

function wrapL(ctx,text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ ctx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=t; }
  if(line) ctx.fillText(line,x,yy);
  return yy+lh;
}

function spaced(ctx,words,x,y,total){
  let sum=0; const w=words.map(s=>{const m=ctx.measureText(s).width; sum+=m; return m;});
  const gap = words.length>1 ? (total-sum)/(words.length-1) : 0;
  let cx=x; words.forEach((s,i)=>{ ctx.fillText(s,cx,y); cx+=w[i]+gap; });
}

function signature(ctx,x,y,s,seed,color,lw){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.strokeStyle=color; ctx.lineWidth=lw||2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  const rnd = rng(seed*7919+13);
  ctx.beginPath(); ctx.moveTo(0,15);
  ctx.bezierCurveTo(-3+rnd()*4,-7, 9,-20-rnd()*6, 15,-5);
  ctx.bezierCurveTo(18,7, 7,15, 9,4);
  let px=9, py=4;
  const n=4+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){
    const step=9+rnd()*11, nx=px+step, ny=4-(i%2?-1:1)*(4+rnd()*13);
    ctx.bezierCurveTo(px+step*0.35, py-9-rnd()*10, nx-step*0.35, ny+7+rnd()*8, nx, ny);
    px=nx; py=ny;
  }
  ctx.bezierCurveTo(px+9, py-13, px+21, py+11, px+29, py-3);
  ctx.stroke();
  ctx.beginPath(); ctx.lineWidth=(lw||2.2)*0.64;
  ctx.moveTo(-5,19); ctx.quadraticCurveTo(px*0.55, 24+rnd()*5, px+25, 12+rnd()*4);
  ctx.stroke(); ctx.restore();
}

/* ---- FINE PRINT X-RAY · tactile lease paper -------------------------- */
const LIME='#38E1FF', CYAN='#0D6B82';
const MONO='"JetBrains Mono", ui-monospace, Menlo, monospace';
function drawGame(ctx){
  const paper=ctx.createLinearGradient(0,0,TW,TH);
  paper.addColorStop(0,'#F7F5EF'); paper.addColorStop(.48,'#ECEBE6'); paper.addColorStop(1,'#D8D9D5');
  ctx.fillStyle=paper; ctx.fillRect(0,0,TW,TH);
  const rnd=rng(47); // subtle deterministic paper fibres, never a grid
  for(let i=0;i<4200;i++){
    const a=.018+rnd()*.035,v=155+Math.floor(rnd()*55);
    ctx.fillStyle=`rgba(${v},${v-2},${v-7},${a})`;
    ctx.fillRect(rnd()*TW,rnd()*TH,.5+rnd()*2,.35+rnd()*.8);
  }
  const edge=ctx.createLinearGradient(0,0,TW,0);
  edge.addColorStop(0,'rgba(28,39,49,.08)');edge.addColorStop(.06,'rgba(255,255,255,0)');edge.addColorStop(.94,'rgba(255,255,255,0)');edge.addColorStop(1,'rgba(28,39,49,.1)');
  ctx.fillStyle=edge;ctx.fillRect(0,0,TW,TH);
  ctx.fillStyle='#102334';ctx.fillRect(0,0,TW,272);
  const glow=ctx.createRadialGradient(920,80,0,920,80,520);glow.addColorStop(0,'rgba(56,225,255,.18)');glow.addColorStop(1,'rgba(56,225,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,TW,330);

  ctx.strokeStyle=LIME; ctx.lineWidth=3;
  [[70,70,1,1],[TW-70,70,-1,1],[TW-70,TH-70,-1,-1],[70,TH-70,1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(x+52*sx,y); ctx.lineTo(x,y); ctx.lineTo(x,y+52*sy); ctx.stroke();
  });
  ctx.fillStyle=LIME;ctx.font='700 18px '+MONO;track(ctx,'FINE PRINT X-RAY  ·  LOCAL ANALYSIS',96,105,4,false);
  ctx.fillStyle='#F3F7FA';ctx.font='600 61px "Inter Tight", Inter, sans-serif';ctx.fillText('RESIDENTIAL',96,181);ctx.fillText('LEASE AGREEMENT',96,240);
  ctx.fillStyle='rgba(221,237,247,.65)';ctx.font='400 16px '+MONO;ctx.fillText('DOCUMENT ID  XR-047-MERCER  ·  PAGE 01 / 01',755,105);

  ctx.fillStyle='#172B3C';ctx.font='700 17px '+MONO;track(ctx,'PARTIES & PREMISES',96,342,3,false);
  ctx.strokeStyle='rgba(16,35,52,.18)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(96,363);ctx.lineTo(TW-96,363);ctx.stroke();
  ctx.fillStyle='#273846';ctx.font='400 22px Inter, sans-serif';
  ctx.fillText('Landlord',96,412);ctx.fillText('Northstar Property Group LLC',355,412);ctx.fillText('Tenant',96,462);ctx.fillText('Jordan Rivera',355,462);ctx.fillText('Premises',96,512);ctx.fillText('47 Mercer Street, Apartment 4B',355,512);

  ctx.fillStyle='#172B3C';ctx.font='700 17px '+MONO;track(ctx,'TERM & PAYMENT',96,600,3,false);ctx.beginPath();ctx.moveTo(96,621);ctx.lineTo(TW-96,621);ctx.stroke();
  ctx.fillStyle='#273846';ctx.font='400 22px Inter, sans-serif';ctx.fillText('Term',96,671);ctx.fillText('November 01, 2026 — October 31, 2027',355,671);ctx.fillText('Monthly rent',96,721);ctx.fillText('$2,450 due on the first calendar day',355,721);ctx.fillText('Security deposit',96,771);ctx.fillText('$2,450 held subject to itemized deductions',355,771);

  ctx.fillStyle='rgba(255,61,90,.09)';rr(ctx,78,842,TW-156,235,13);ctx.fill();ctx.strokeStyle='#D72E4B';ctx.lineWidth=3;rr(ctx,78,842,TW-156,235,13);ctx.stroke();
  ctx.fillStyle='#C62342';ctx.font='700 16px '+MONO;track(ctx,'⬢  CRITICAL FLAG  ·  MANDATORY ARBITRATION',106,886,2,false);
  ctx.fillStyle='#263743';ctx.font='500 23px Inter, sans-serif';wrapL(ctx,'Any dispute arising under this Lease shall be resolved by binding arbitration. Tenant waives the right to trial by jury and participation in any class action.',106,938,TW-212,34);
  ctx.fillStyle='#C62342';ctx.font='700 17px '+MONO;ctx.fillText('YOU GIVE UP THE RIGHT TO SUE IN COURT.',106,1043);

  ctx.fillStyle='#172B3C';ctx.font='700 17px '+MONO;track(ctx,'ADDITIONAL TERMS',96,1156,3,false);ctx.strokeStyle='rgba(16,35,52,.18)';ctx.beginPath();ctx.moveTo(96,1177);ctx.lineTo(TW-96,1177);ctx.stroke();
  ctx.fillStyle='#34444F';ctx.font='400 19px Inter, sans-serif';
  const terms=['01  Entry permitted with twelve hours written notice.','02  Late charge: $125 plus $25 for each additional day.','03  Early termination: three months rent and deposit forfeiture.','04  Lease renews for one year unless notice is given 90 days prior.'];
  terms.forEach((line,i)=>ctx.fillText(line,96,1230+i*46));
  ctx.fillStyle='rgba(56,225,255,.12)';rr(ctx,78,1417,TW-156,88,10);ctx.fill();ctx.fillStyle='#0D6B82';ctx.font='700 16px '+MONO;ctx.fillText('SCAN SUMMARY',106,1453);ctx.font='500 18px '+MONO;ctx.fillText('05 NEED ATTENTION  ·  01 CRITICAL  ·  CONFIDENCE 98%',310,1453);
  ctx.strokeStyle='rgba(16,35,52,.22)';ctx.beginPath();ctx.moveTo(96,1550);ctx.lineTo(490,1550);ctx.moveTo(710,1550);ctx.lineTo(1104,1550);ctx.stroke();ctx.fillStyle='#52616B';ctx.font='400 14px '+MONO;ctx.fillText('TENANT SIGNATURE',96,1580);ctx.fillText('DATE',710,1580);
}

let chamberContent={clauses:[],pageNumber:1,pageCount:1,totalClauses:0,clauseOffset:0,documentTitle:'YOUR DOCUMENT'};
function chamberClauses(){return chamberContent.clauses}
let chamberHover=-1;
const clauseTop=374,clauseAreaHeight=1160;
function clauseLayout(){return {shown:chamberClauses().slice(0,8),blockH:clauseAreaHeight/Math.max(1,Math.min(8,chamberClauses().length))}}
function textLines(ctx,text,maxWidth){
  const lines=[];let line='';
  for(const word of String(text||'').replace(/\s+/g,' ').trim().split(' ')){
    const next=line?line+' '+word:word;
    if(ctx.measureText(next).width<=maxWidth){line=next;continue}
    if(line){lines.push(line);line=''}
    if(ctx.measureText(word).width<=maxWidth){line=word;continue}
    for(const char of word){if(ctx.measureText(line+char).width>maxWidth){lines.push(line);line=''}line+=char}
  }
  if(line)lines.push(line);return lines;
}
function drawChamber(ctx){
  drawGame(ctx);
  const risk={critical:'#B71D3A',high:'#B95016',moderate:'#856405',safe:'#08745A',neutral:'#5D6B76'};
  ctx.fillStyle='#102334';ctx.fillRect(80,130,TW-160,130);
  ctx.fillStyle='#F3F7FA';ctx.font='700 43px Arial, sans-serif';
  const titleLines=textLines(ctx,chamberContent.documentTitle||'YOUR DOCUMENT',TW-192);
  titleLines.slice(0,2).forEach((line,i)=>ctx.fillText(line,96,181+i*52));
  ctx.fillStyle='#b9d0de';ctx.font='500 15px '+MONO;
  ctx.fillRect(740,80,TW-810,35);ctx.fillStyle='#102334';ctx.fillRect(730,78,TW-800,40);
  ctx.fillStyle='#b9d0de';ctx.fillText('PAGE '+String(chamberContent.pageNumber).padStart(2,'0')+' / '+String(chamberContent.pageCount).padStart(2,'0'),890,104);
  const wash=ctx.createLinearGradient(0,292,TW,TH);wash.addColorStop(0,'#F6F4EE');wash.addColorStop(.55,'#ECEBE6');wash.addColorStop(1,'#DADBD7');
  ctx.fillStyle=wash;ctx.fillRect(42,292,TW-84,TH-342);
  const grain=rng(83);
  for(let i=0;i<2600;i++){const v=160+Math.floor(grain()*50);ctx.fillStyle='rgba('+v+','+(v-2)+','+(v-7)+','+(.014+grain()*.026)+')';ctx.fillRect(42+grain()*(TW-84),292+grain()*(TH-342),.5+grain()*1.7,.3+grain()*.7)}
  ctx.fillStyle='#172B3C';ctx.font='700 17px '+MONO;track(ctx,'CLAUSE X-RAY  ·  MARKED IN DOCUMENT',96,338,3,false);
  ctx.strokeStyle='rgba(16,35,52,.2)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(96,361);ctx.lineTo(TW-96,361);ctx.stroke();
  const {shown,blockH}=clauseLayout();
  shown.forEach((clause,index)=>{const top=clauseTop+index*blockH,y=top+28,color=risk[clause.severity]||risk.neutral;
    ctx.save();ctx.beginPath();ctx.rect(82,top,TW-164,blockH-10);ctx.clip();
    ctx.fillStyle=color;ctx.globalAlpha=index===chamberHover?.15:clause.severity==='neutral'?.025:.065;rr(ctx,82,top,TW-164,blockH-10,5);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=color;ctx.fillRect(92,top+5,4,blockH-20);ctx.font='700 16px '+MONO;
    const label=String(chamberContent.clauseOffset+index+1).padStart(2,'0')+'  '+String(clause.category||'CLAUSE').toUpperCase()+'  ·  '+(clause.severity==='neutral'?'NOT FLAGGED':String(clause.severity||'neutral').toUpperCase());
    ctx.fillText(label,112,y,TW-226);
    ctx.fillStyle='#263743';ctx.font='400 20px Arial, sans-serif';
    const lines=textLines(ctx,clause.originalText,TW-230),maxLines=Math.max(1,Math.floor((blockH-64)/25)),overflow=lines.length>maxLines;
    lines.slice(0,maxLines).forEach((line,i)=>ctx.fillText(line,112,y+35+i*25));
    if(overflow){ctx.fillStyle='#365868';ctx.font='600 15px '+MONO;ctx.fillText('CONTINUED IN READING VIEW →',112,top+blockH-18)}
    ctx.restore();
    ctx.strokeStyle='rgba(16,35,52,.12)';ctx.beginPath();ctx.moveTo(112,top+blockH-2);ctx.lineTo(TW-104,top+blockH-2);ctx.stroke();
  });

}

let certCanvas=null,certCtx=null,certTexture=null;
function paintCertTexture(){
  const c=certCanvas,ctx=certCtx;
  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  ctx.scale(CW/TW, CH/TH);          // author on the 1200x1656 grid, render bigger
  rr(ctx,0,0,TW,TH,26); ctx.clip();
  drawChamber(ctx);
  ctx.restore();
  if(certTexture)certTexture.needsUpdate=true;
}
function makeCertTexture(){
  certCanvas=document.createElement('canvas');certCanvas.width=CW;certCanvas.height=CH;certCtx=certCanvas.getContext('2d');
  paintCertTexture();
  const t = new T.CanvasTexture(certCanvas);certTexture=t;
  t.encoding = T.sRGBEncoding; t.anisotropy = 8; t.needsUpdate = true;
  return t;
}

/* ======================================================================
   2. GRAIN
   ====================================================================== */
(function grain(){
  const n=160, c=document.createElement('canvas'); c.width=c.height=n;
  const x=c.getContext('2d'), d=x.createImageData(n,n);
  for(let i=0;i<n*n;i++){
    const v = 128 + (Math.random()-0.5)*168;
    d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v; d.data[i*4+3]=255;
  }
  x.putImageData(d,0,0);
  const url='url('+c.toDataURL()+')';
  document.getElementById('grain').style.backgroundImage=url;
  document.getElementById('grain2').style.backgroundImage=url;
})();

/* ======================================================================
   3. SCENE
   ====================================================================== */
const canvas = document.getElementById('gl');
const renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:true,
                                      powerPreference:'high-performance'});
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.NoToneMapping;

const scene  = new T.Scene();
const camera = new T.PerspectiveCamera(24, 1, 0.1, 100);
camera.position.set(0,0,8.2);

function envTexture(){
  const w=1024,h=512,c=document.createElement('canvas');
  c.width=w;c.height=h; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#3a3d47'); g.addColorStop(.46,'#171820'); g.addColorStop(1,'#08080a');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  const blob=(cx,cy,rx,ry,col,a)=>{
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
    rg.addColorStop(0,col.replace('A',a)); rg.addColorStop(1,col.replace('A','0'));
    x.save(); x.translate(cx,cy); x.scale(1,ry/rx); x.translate(-cx,-cy);
    x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,rx,0,7); x.fill(); x.restore();
  };
  blob(w*0.30,h*0.24,330,240,'rgba(255,252,246,A)','1');
  blob(w*0.74,h*0.34,240,200,'rgba(150,175,235,A)','.42');
  blob(w*0.52,h*0.86,420,190,'rgba(255,170,120,A)','.10');
  const t=new T.CanvasTexture(c);
  t.mapping=T.EquirectangularReflectionMapping; t.encoding=T.sRGBEncoding;
  return t;
}
const pmrem = new T.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(envTexture()).texture;

const key  = new T.DirectionalLight(0xfff6ec, 1.42); key.position.set(-3.3,2.1,2.0);
const fill = new T.DirectionalLight(0x9fb6ff, 0.13); fill.position.set(3.6,-1.8,1.6);
const rim  = new T.DirectionalLight(0xffffff, 0.10); rim.position.set(1.6,1.2,-2.6);
scene.add(key,fill,rim,new T.AmbientLight(0xffffff,0.16));

const touchLight = new T.PointLight(0x38e1ff, 0, 7.5, 1.35);
touchLight.position.set(0,0,1.7); scene.add(touchLight);

/* ---- geometry + the bend ------------------------------------------- */
const SW = 2.30, SH = 2.72;
const geo = new T.PlaneGeometry(SW,SH,72,96);

const uni = {
  uTime:{value:0}, uAmp:{value:1.18}, uFreq:{value:4.70}, uTwist:{value:1.30},
  uSize:{value:new T.Vector2(SW,SH)}, uFlutter:{value:0}, uPhase:{value:0},
  uRim:{value:0.16}, uRimA:{value:0.0}, uSpecA:{value:0.0},
  uRimCol:{value:new T.Color(0x38e1ff)}
};

const WAVE = `
uniform float uTime, uAmp, uFlutter, uPhase, uFreq, uTwist;
uniform vec2  uSize;

// the sheet hangs: it curls harder at the top than along the bottom edge
float sAmp(float u, float v){ return uAmp*(0.10 + pow(u,1.35))*(0.50 + 0.64*v); }
float sAmpV(float u){        return uAmp*(0.10 + pow(u,1.35))*0.64; }

float sTheta(float u, float v){
  float a  = sAmp(u,v);
  float ph = uFreq*u + uTwist*v + uTime*0.40 + uPhase;
  return a*sin(ph) + uFlutter*a*0.60*sin(ph*2.35 + uTime*2.0);
}
float sThetaV(float u, float v){
  float a  = sAmp(u,v), da = sAmpV(u);
  float ph = uFreq*u + uTwist*v + uTime*0.40 + uPhase;
  float f  = ph*2.35 + uTime*2.0;
  return da*sin(ph) + a*cos(ph)*uTwist
       + uFlutter*0.60*(da*sin(f) + a*cos(f)*uTwist*2.35);
}
float sYoff(float u, float v){
  float w = 1.0 - 0.55*v;
  return 0.021*uSize.y*sin(2.05*u + uTime*0.47 + uPhase)
       + 0.013*uSize.y*sin(3.35*u - 1.55*v + uTime*0.63 + uPhase)*w;
}
float sYdU(float u, float v){
  float w = 1.0 - 0.55*v;
  return 0.0431*uSize.y*cos(2.05*u + uTime*0.47 + uPhase)
       + 0.0436*uSize.y*cos(3.35*u - 1.55*v + uTime*0.63 + uPhase)*w;
}
float sYdV(float u, float v){
  float ph = 3.35*u - 1.55*v + uTime*0.63 + uPhase;
  return 0.013*uSize.y*(-1.55*cos(ph)*(1.0-0.55*v) - 0.55*sin(ph));
}

// paper conserves arc length: integrate the bend instead of pushing Z,
// so the silhouette really pulls in where the sheet turns away
void sheetPoint(vec2 q, out vec3 P, out vec3 NN){
  float u = q.x, v = q.y;
  float x=0.0, z=0.0, xe=0.0, ze=0.0, dxv=0.0, dzv=0.0, dxe=0.0, dze=0.0;
  const int NS = 20;
  float h = 1.0/float(NS);
  for(int i=0;i<NS;i++){
    float uu = (float(i)+0.5)*h;
    float w  = clamp((u-(uu-0.5*h))/h, 0.0, 1.0);
    float th = sTheta(uu,v);
    float dt = sThetaV(uu,v);
    float c = cos(th), sn = sin(th);
    xe += c*h;          ze += sn*h;
    dxe += -sn*dt*h;    dze +=  c*dt*h;
    x   += c*h*w;       z   += sn*h*w;
    dxv += -sn*dt*h*w;  dzv +=  c*dt*h*w;
  }
  float W = uSize.x, H = uSize.y;
  float th0 = sTheta(u,v);
  P = vec3((x - xe*0.5)*W, (v-0.5)*H + sYoff(u,v), (z - ze*0.5)*W);
  vec3 Tu = vec3(W*cos(th0), sYdU(u,v), W*sin(th0));
  vec3 Tv = vec3((dxv - dxe*0.5)*W, H + sYdV(u,v), (dzv - dze*0.5)*W);
  NN = normalize(cross(Tu, Tv));
}`;

const tex = makeCertTexture();
const mat = new T.MeshPhysicalMaterial({
  map: tex, color: new T.Color(0xffffff), side: T.DoubleSide, metalness: 0.0,
  roughness: 0.64, clearcoat: 0.18, clearcoatRoughness: 0.48,
  envMapIntensity: 0.46, specularIntensity: 0.38,
  transparent: true, alphaTest: 0.08, opacity: 0.985
});
mat.onBeforeCompile = (sh)=>{
  Object.assign(sh.uniforms, uni);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\n'+WAVE)
    .replace('#include <beginnormal_vertex>', `
      vec3 sheetP; vec3 objectNormal;
      sheetPoint(uv, sheetP, objectNormal);
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3( tangent.xyz );
      #endif
    `)
    .replace('#include <begin_vertex>', 'vec3 transformed = sheetP;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>',
      '#include <common>\nuniform float uRim, uRimA, uSpecA;\nuniform vec3 uRimCol;')
    // judge the cut against the artwork's own alpha, not alpha*opacity
    .replace('#include <alphatest_fragment>',
      'if ( diffuseColor.a / max(opacity,1e-4) < alphaTest ) discard;')
    .replace('#include <output_fragment>', `
      float fres = pow(1.0 - clamp(abs(dot(geometry.normal, geometry.viewDir)),0.0,1.0), 3.2);
      outgoingLight += fres * uRim * uRimCol;
      float baseA = diffuseColor.a / max(opacity, 1e-4);
      float outA  = clamp(baseA + fres*uRimA
                        + uSpecA*dot(outgoingLight, vec3(0.3333)), 0.0, 1.0) * opacity;
      gl_FragColor = vec4( outgoingLight, outA );
    `);
};

const mesh  = new T.Mesh(geo, mat);
const group = new T.Group(); group.add(mesh); scene.add(group);

// a faint dark cloud so the sheet sits in front of the wordmark
const haloTex = (()=>{
  const s=256,c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(.45,'rgba(0,0,0,.28)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t;
})();
const halo = new T.Mesh(new T.PlaneGeometry(3.9,4.9),
  new T.MeshBasicMaterial({map:haloTex, transparent:true, depthWrite:false, opacity:0.47}));
halo.position.z = -0.62; group.add(halo);

/* ======================================================================
   4. POINTER — drag to turn, hover to light
   ====================================================================== */
let dragging=false, dragYaw=0, dragPitch=0, release=0;
// spin carried after release, in rad/second — integrated with dt so the
// fling travels the same distance at 60Hz and at 120Hz
let velYaw=0, velPitch=0, prevYaw=0, prevPitch=0;
let lastPX=0, lastPY=0, moved=0, overSheet=false, hover=0, hoverTarget=0;
let quad=null, cursorNow='';
const mouse = {x:0,y:0,tx:0,ty:0};
const hintEl = document.getElementById('hint');
let hintUsed=false;

// JS mirror of the GLSL bend, corners only — enough to know whether the
// pointer is on the paper
const _v = new T.Vector3();
function cornerPoint(qx,qy){
  const t = uni.uTime.value, ph = uni.uPhase.value;
  const A = uni.uAmp.value, F = uni.uFreq.value, TWs = uni.uTwist.value;
  const u = qx, v = qy;
  const theta = (uu)=> A*(0.10+Math.pow(uu,1.35))*(0.50+0.64*v)
                      * Math.sin(F*uu + TWs*v + t*0.40 + ph);
  let x=0,z=0,xe=0,ze=0; const N=20, h=1/N;
  for(let i=0;i<N;i++){
    const uu=(i+0.5)*h, w=clamp((u-(uu-0.5*h))/h,0,1);
    const th=theta(uu), c=Math.cos(th), s=Math.sin(th);
    xe+=c*h; ze+=s*h; x+=c*h*w; z+=s*h*w;
  }
  const yo = 0.021*SH*Math.sin(2.05*u + t*0.47 + ph)
           + 0.013*SH*Math.sin(3.35*u - 1.55*v + t*0.63 + ph)*(1-0.55*v);
  return _v.set((x-xe*0.5)*SW, (v-0.5)*SH + yo, (z-ze*0.5)*SW);
}
function buildQuad(){
  const pts=[];
  for(const [u,v] of [[0,1],[1,1],[1,0],[0,0]]){
    cornerPoint(u,v).applyMatrix4(group.matrixWorld).project(camera);
    pts.push([(_v.x*0.5+0.5)*vw, (-_v.y*0.5+0.5)*vh]);
  }
  const cx=(pts[0][0]+pts[1][0]+pts[2][0]+pts[3][0])/4;
  const cy=(pts[0][1]+pts[1][1]+pts[2][1]+pts[3][1])/4;
  quad = pts.map(([x,y])=>[cx+(x-cx)*1.07, cy+(y-cy)*1.07]);
}
function inQuad(px,py){
  if(!quad) return false;
  let sign=0;
  for(let i=0;i<4;i++){
    const [ax,ay]=quad[i], [bx,by]=quad[(i+1)%4];
    const c=(bx-ax)*(py-ay)-(by-ay)*(px-ax);
    if(c!==0){ const s=c>0?1:-1; if(sign===0) sign=s; else if(s!==sign) return false; }
  }
  return true;
}
function useHint(){ hintUsed=true; hintEl.style.opacity='0'; }

function screenToPaper(px,py){
  if(!quad)return null;
  const p00=quad[0],p10=quad[1],p11=quad[2],p01=quad[3];
  let u=.5,v=.5;
  for(let i=0;i<7;i++){
    const x=(1-u)*(1-v)*p00[0]+u*(1-v)*p10[0]+u*v*p11[0]+(1-u)*v*p01[0];
    const y=(1-u)*(1-v)*p00[1]+u*(1-v)*p10[1]+u*v*p11[1]+(1-u)*v*p01[1];
    const xu=(1-v)*(p10[0]-p00[0])+v*(p11[0]-p01[0]),yu=(1-v)*(p10[1]-p00[1])+v*(p11[1]-p01[1]);
    const xv=(1-u)*(p01[0]-p00[0])+u*(p11[0]-p10[0]),yv=(1-u)*(p01[1]-p00[1])+u*(p11[1]-p10[1]);
    const det=xu*yv-xv*yu;if(Math.abs(det)<.001)break;
    const dx=px-x,dy=py-y;u+=(dx*yv-dy*xv)/det;v+=(dy*xu-dx*yu)/det;
  }
  return u>=0&&u<=1&&v>=0&&v<=1?{u,v}:null;
}
function clauseAt(px,py){
  const uv=screenToPaper(px,py),{shown,blockH}=clauseLayout();if(!uv||!shown.length)return-1;
  const paperY=uv.v*TH,index=Math.floor((paperY-clauseTop)/blockH);
  return index>=0&&index<shown.length?index:-1;
}
function setChamberHover(index){
  if(index===chamberHover)return;chamberHover=index;paintCertTexture();
  window.parent.postMessage({type:'threeui-clause-hover',index},location.origin);
}

window.addEventListener('pointermove', e=>{
  mouse.tx = (e.clientX/window.innerWidth  - 0.5)*2;
  mouse.ty = (e.clientY/window.innerHeight - 0.5)*2;
  if(dragging){
    const dx=e.clientX-lastPX, dy=e.clientY-lastPY;
    lastPX=e.clientX; lastPY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    dragYaw   += dx*0.0060;                   // glass prints through, so a
    dragPitch  = clamp(dragPitch - dy*0.0045, -0.60, 0.60);  // full turn is honest
    if(moved>40) useHint();
    return;
  }
  overSheet = inQuad(e.clientX,e.clientY);
  hoverTarget = overSheet ? 1 : 0;
  setChamberHover(overSheet?clauseAt(e.clientX,e.clientY):-1);
}, {passive:true});

window.addEventListener('pointerdown', e=>{
  if(inQuad(e.clientX,e.clientY)){
    dragging=true; moved=0; lastPX=e.clientX; lastPY=e.clientY;
    velYaw=velPitch=0; prevYaw=dragYaw; prevPitch=dragPitch;
  }
});
window.addEventListener('pointerup', e=>{
  if(dragging){
    const selected=moved<8?clauseAt(e.clientX,e.clientY):-1;
    dragging=false;release=0.6;
    if(selected>=0){
      setView(Math.max(targetZoom,1.8),selected);
      window.parent.postMessage({type:'threeui-clause-select',index:selected},location.origin);
    }
  }
});
window.addEventListener('pointerleave', ()=>{ hoverTarget=0;setChamberHover(-1); });

/* ======================================================================
   5. RESIZE
   ====================================================================== */
let vw=0, vh=0;
let baseScale=1, viewZoom=1, targetZoom=1, viewFocus=0, targetFocus=0;
function setView(zoom,focusIndex=-1){
  targetZoom=clamp(Number(zoom)||1,.82,2.5);
  const {blockH}=clauseLayout();
  const centerY=clauseTop+Math.max(0,focusIndex)*blockH+blockH*.5;
  targetFocus=focusIndex>=0?clamp(centerY/TH-.5,-.34,.34):0;
  if(REDUCED){viewZoom=targetZoom;viewFocus=targetFocus}
}
function resize(){
  vw = window.innerWidth; vh = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,matchMedia('(max-width:700px)').matches?1:1.5));
  renderer.setSize(vw,vh,false);
  camera.aspect = vw/vh; camera.updateProjectionMatrix();
  const visH = 2*camera.position.z*Math.tan(T.MathUtils.degToRad(camera.fov)/2);
  const visW = visH*camera.aspect;
  const wCap = Math.min(0.88, 0.60 + Math.max(0, 1.45 - camera.aspect)*0.45);
  baseScale=Math.min(visH*0.735/SH, visW*wCap/SW);
  group.scale.setScalar(baseScale*viewZoom);
}
window.addEventListener('resize', resize);
window.addEventListener('wheel',e=>{
  if(!inQuad(e.clientX,e.clientY))return;
  e.preventDefault();
  setView(targetZoom*(e.deltaY>0?.90:1.10),targetZoom>1.05?chamberHover:-1);
},{passive:false});
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.origin!==location.origin)return;
  if(event.data?.type==='threeui-paper-view'){
    setView(event.data.zoom,event.data.focusIndex);if(REDUCED)frame();
  }
  if(event.data?.type==='threeui-paper-content'&&Array.isArray(event.data.clauses)){
    const data=event.data;
    chamberContent={clauses:data.clauses.filter(c=>c&&typeof c.originalText==='string'),pageNumber:Math.max(1,Number(data.pageNumber)||1),pageCount:Math.max(1,Number(data.pageCount)||1),totalClauses:Math.max(0,Number(data.totalClauses)||data.clauses.length),clauseOffset:Math.max(0,Number(data.clauseOffset)||0),documentTitle:String(data.documentTitle||'YOUR DOCUMENT')};
    chamberHover=-1;paintCertTexture();setView(data.zoom,data.focusIndex);
    if(REDUCED)frame();
    window.parent.postMessage({type:'threeui-paper-content-ready'},location.origin);
  }
  if(event.data?.type==='threeui-paper-visibility'){
    sceneVisible=!!event.data.visible;
    if(!sceneVisible&&frameId){cancelAnimationFrame(frameId);frameId=0}
    else if(sceneVisible&&!frameId)frame();
  }
});
canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();window.parent.postMessage({type:'threeui-paper-error'},location.origin)});

/* ======================================================================
   6. LOOP
   ====================================================================== */
const clock = new T.Clock();
const lightPos = new T.Vector3();
let intro = 1,sceneVisible=true,frameId=0,lastPaint=0;

function frame(){
  frameId=0;
  const frameNow=performance.now();
  if(!REDUCED&&sceneVisible&&!document.hidden&&frameNow-lastPaint<1000/30){frameId=requestAnimationFrame(frame);return}
  lastPaint=frameNow;
  if(!REDUCED&&sceneVisible&&!document.hidden)frameId=requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  uni.uTime.value = REDUCED ? 2.4 : t;

  intro = REDUCED ? 1 : intro + (1 - intro) * Math.min(1, dt*1.9);
  mat.opacity = intro;
  halo.material.opacity = intro*0.47;
  if(intro > 0.7 && !hintUsed && !REDUCED) hintEl.style.opacity='1';

  if(dragging){
    // measure the throw as an angular velocity, smoothed over a few frames
    const k = Math.min(1, dt*14);
    velYaw   += ((dragYaw   - prevYaw  )/Math.max(dt,1e-3) - velYaw  ) * k;
    velPitch += ((dragPitch - prevPitch)/Math.max(dt,1e-3) - velPitch) * k;
    velYaw   = clamp(velYaw,  -7, 7);
    velPitch = clamp(velPitch,-4, 4);
  } else {
    dragYaw   += velYaw*dt;
    dragPitch  = clamp(dragPitch + velPitch*dt, -0.60, 0.60);
    const decay = Math.pow(0.018, dt);
    velYaw *= decay; velPitch *= decay;
    release = Math.max(0, release - dt);
    if(release <= 0){
      // settle on the nearest whole turn rather than unwinding a full spin
      const home = Math.round(dragYaw/(Math.PI*2))*Math.PI*2;
      const k = Math.min(1, dt*0.55);
      dragYaw   += (home - dragYaw)*k;
      dragPitch -= dragPitch*k;
    }
  }
  prevYaw = dragYaw; prevPitch = dragPitch;

  const viewEase=Math.min(1,dt*(REDUCED?30:5.2));
  viewZoom+=(targetZoom-viewZoom)*viewEase;
  viewFocus+=(targetFocus-viewFocus)*viewEase;
  group.scale.setScalar(baseScale*viewZoom);

  mouse.x += (mouse.tx-mouse.x)*Math.min(1,dt*3.0);
  mouse.y += (mouse.ty-mouse.y)*Math.min(1,dt*3.0);
  const idle = REDUCED ? 0 : 1;
  const rise = 1 - intro;
  group.rotation.y = REDUCED ? 0 : dragYaw + mouse.x*0.16 + Math.sin(t*0.23)*0.045*idle;
  group.rotation.x = REDUCED ? 0 : dragPitch - mouse.y*0.11 + Math.sin(t*0.19)*0.026*idle + rise*0.28;
  group.rotation.z = Math.sin(t*0.27)*0.018*idle;
  group.position.y = Math.sin(t*0.36)*0.06*idle - rise*0.7 + viewFocus*SH*baseScale*viewZoom;
  group.position.x = REDUCED ? 0 : Math.sin(t*0.21)*0.05*idle + mouse.x*0.10;
  group.updateMatrixWorld();

  hover += (hoverTarget - hover) * Math.min(1, dt*4.5);
  touchLight.intensity = hover * 2.6 * intro;
  if(hover > 0.002){
    lightPos.set(mouse.tx, -mouse.ty, 0.5).unproject(camera).sub(camera.position).normalize();
    touchLight.position.copy(camera.position)
      .addScaledVector(lightPos, (1.75 - camera.position.z)/lightPos.z);
  }

  buildQuad();
  const wantCursor = dragging ? 'grabbing' : (overSheet ? 'grab' : '');
  if(wantCursor !== cursorNow){ cursorNow = wantCursor; document.body.style.cursor = wantCursor; }

  renderer.render(scene,camera);
}

function boot(){
  const t2 = makeCertTexture();
  tex.dispose(); mat.map = t2; mat.needsUpdate = true;
  resize();
  mesh.visible = true; mat.opacity = 0.002;
  renderer.compile(scene,camera); renderer.render(scene,camera);
  mat.opacity = 1;
  frame();
  window.parent.postMessage({type:'threeui-paper-ready'},location.origin);
}

if(document.fonts && document.fonts.ready){
  Promise.race([
    Promise.all([
      document.fonts.load('700 104px "Inter Tight"'),
      document.fonts.load('600 110px "Inter Tight"'),
      document.fonts.load('600 34px "Inter"'),
      document.fonts.load('500 22px "Inter"'),
      document.fonts.load('700 26px "JetBrains Mono"'),
      document.fonts.load('400 22px "JetBrains Mono"')
    ]).then(()=>document.fonts.ready),
    new Promise(r=>setTimeout(r,2500))
  ]).then(boot);
} else boot();

window.__sheet = {group, mat, uni, renderer, scene, camera, mesh,
  state:()=>({intro, dragYaw, dragPitch, hover, quad}),
  hit:(x,y)=>inQuad(x,y),
  spin:(y)=>{ dragYaw=y; release=1e9; }};
})();
</script>
